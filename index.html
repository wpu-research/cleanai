<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0e1418">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e1418'/%3E%3Crect x='6' y='9' width='20' height='15' rx='2' fill='none' stroke='%2319c6e0' stroke-width='2'/%3E%3Crect x='11' y='5' width='10' height='4' rx='1' fill='%2319c6e0'/%3E%3C/svg%3E">
<title>CleanAi — Temiz Oda 3D</title>
<style>
  :root{
    --bg:#0e1418; --panel:#161e24; --line:#263238; --fg:#e6eef2; --dim:#8da2ad; --acc:#19c6e0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
  #view{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair;
    touch-action:none;-webkit-user-select:none;user-select:none}
  .panel{position:fixed;background:rgba(22,30,36,.92);border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;backdrop-filter:blur(8px)}
  #top{top:12px;left:12px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  #top h1{font-size:14px;margin:0;letter-spacing:.3px}
  #top h1 span{color:var(--acc)}
  .grp{display:flex;gap:6px;align-items:center}
  .grp>label{color:var(--dim);font-size:12px}
  button{background:#1e2a32;color:var(--fg);border:1px solid var(--line);border-radius:7px;
    padding:5px 10px;font:inherit;font-size:12px;cursor:pointer}
  button:hover{border-color:var(--acc)}
  button.on{background:var(--acc);color:#06222a;border-color:var(--acc);font-weight:600}
  select{background:#1e2a32;color:var(--fg);border:1px solid var(--line);border-radius:7px;
    padding:5px 8px;font:inherit;font-size:12px}
  #info{bottom:12px;left:12px;max-width:340px}
  #planName{font-weight:600;color:var(--acc);margin-bottom:6px}
  .row{display:flex;justify-content:space-between;gap:12px;padding:3px 0;
    border-top:1px solid var(--line);font-size:12px}
  .row:first-of-type{border-top:0}
  .row span{color:var(--dim);text-align:right}
  #hint{bottom:12px;right:12px;color:var(--dim);font-size:12px;max-width:360px}
  #crosshair{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;
    border-radius:50%;background:rgba(255,255,255,.75);display:none;pointer-events:none}
  #toast{position:fixed;left:50%;bottom:70px;transform:translate(-50%,16px);
    background:var(--acc);color:#06222a;padding:9px 16px;border-radius:8px;font-weight:600;
    font-size:13px;opacity:0;transition:.25s;pointer-events:none}
  #toast.show{opacity:1;transform:translate(-50%,0)}

  #projects{top:84px;right:12px;width:258px;max-height:calc(100vh - 110px);
    display:flex;flex-direction:column;gap:8px}
  .phead{display:flex;justify-content:space-between;align-items:center;gap:8px;
    font-size:13px;border-bottom:1px solid var(--line);padding-bottom:6px}
  .dot{width:8px;height:8px;border-radius:50%;background:#555;flex:none}
  .dot.on{background:#2bd67b}.dot.off{background:#ff4d4f}
  #projList{overflow:auto;display:flex;flex-direction:column;gap:4px;min-height:40px}
  .proj{text-align:left;padding:6px 8px;line-height:1.3}
  .proj small{display:block;color:var(--dim);font-size:11px;margin-top:2px}
  .proj.on small{color:#06222a;opacity:.75}
  .pactions{display:flex;gap:6px;flex-wrap:wrap}
  .pactions button{flex:1}
  button.danger:hover{border-color:#ff4d4f;color:#ff8a8c}

  #editor{display:none;left:12px;top:84px;width:420px;max-height:calc(100vh - 110px);
    flex-direction:column;gap:8px}
  #editor.open{display:flex}
  #editor .small{margin:0;font-size:11px;color:var(--dim)}
  #editor code{color:var(--acc)}
  #planJson{flex:1;min-height:320px;background:#0c1317;color:#cfe3ea;border:1px solid var(--line);
    border-radius:7px;padding:8px;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
  .err{color:#ff8a8c;font-size:11px;white-space:pre-wrap;max-height:96px;overflow:auto}
  #importer{display:none;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,96vw);
    max-height:92vh;overflow:auto;flex-direction:column;gap:10px;z-index:20}
  #importer.open{display:flex}
  #impDrop{border:1.5px dashed var(--line);border-radius:8px;padding:12px;display:flex;gap:10px;
    align-items:center;flex-wrap:wrap}
  #impDrop.over{border-color:var(--acc);background:#10252b}
  #impCanvas{width:100%;max-width:560px;align-self:center;border-radius:6px;background:#0c1317}
  .irow{display:flex;gap:8px;align-items:center;padding:3px 0;border-top:1px solid var(--line);font-size:12px}
  .irow .n{width:18px;color:var(--acc);font-weight:600}
  .dim{color:var(--dim)} .warn{color:#ffb020} .bad{color:#ff8a8c}
  .fld{display:flex;gap:8px;align-items:center;font-size:12px;flex-wrap:wrap}
  .fld input[type=number],.fld input[type=text]{background:#1e2a32;color:var(--fg);border:1px solid var(--line);
    border-radius:7px;padding:5px 8px;font:inherit;font-size:12px;width:90px}
  .fld input[type=text]{width:180px}
  /* ---------- mobil ---------- */
  #menuBtn,#mobilebar,#stick{display:none}

  @media (max-width:900px), (pointer:coarse) and (max-width:1100px){
    :root{--gut:10px}
    button,select{font-size:14px;padding:9px 12px}          /* dokunma hedefi ≥ 40 px */
    .fld input[type=number],.fld input[type=text]{font-size:16px;padding:8px 10px} /* iOS zoom'u engeller */

    /* üst çubuk: ☰ ile açılan tam genişlik çekmece */
    #menuBtn{display:flex;align-items:center;justify-content:center;position:fixed;z-index:30;
      top:calc(env(safe-area-inset-top) + var(--gut));left:var(--gut);width:46px;height:46px;
      font-size:20px;line-height:1;background:rgba(22,30,36,.95);border:1px solid var(--line);
      border-radius:12px;backdrop-filter:blur(8px)}
    #top{display:none;top:calc(env(safe-area-inset-top) + 64px);left:var(--gut);right:var(--gut);
      flex-direction:column;align-items:stretch;gap:10px;max-height:62vh;overflow:auto;z-index:29}
    #top.open{display:flex}
    #top h1{font-size:15px;padding-bottom:8px;border-bottom:1px solid var(--line)}
    .grp{flex-wrap:wrap}
    .grp>label{width:100%;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
    .grp button,.grp select{flex:1 1 auto;min-width:86px}

    /* paneller: alttan açılan sayfalar */
    #projects,#editor,#importer{display:none;position:fixed;left:0;right:0;bottom:0;top:auto;
      width:auto;max-width:none;transform:none;border-radius:16px 16px 0 0;z-index:28;
      max-height:76vh;padding:12px 14px calc(env(safe-area-inset-bottom) + 72px);
      border-left:0;border-right:0;border-bottom:0}
    #projects.open,#editor.open,#importer.open{display:flex;flex-direction:column}
    #projects{gap:10px}
    #projList{max-height:38vh}
    .proj{padding:10px}
    .pactions button{min-height:42px}
    #planJson{min-height:34vh;font-size:13px}
    /* önizleme ekranın yarısını yemesin, "oluştur" her zaman parmağın altında kalsın */
    #impCanvas{width:auto;height:auto;max-width:100%;max-height:32vh}
    #impList{max-height:22vh;overflow:auto}
    #importer .pactions:last-child{position:sticky;bottom:0;margin:0 -14px -4px;
      padding:10px 14px 0;background:linear-gradient(transparent,rgba(22,30,36,.97) 30%)}
    #impCreate{min-height:48px;font-size:14px}

    /* bilgi şeridi ve ipucu */
    #info{display:none;left:var(--gut);right:var(--gut);bottom:calc(env(safe-area-inset-bottom) + 76px);
      max-width:none;font-size:12px;z-index:26}
    #info.open{display:block}
    #hint{display:none}
    #crosshair{display:none !important}
    #toast{bottom:calc(env(safe-area-inset-bottom) + 86px);left:var(--gut);right:var(--gut);
      transform:none;text-align:center;font-size:13px}
    #toast.show{transform:none}

    /* alt eylem çubuğu */
    #mobilebar{display:flex;gap:8px;position:fixed;z-index:31;left:0;right:0;
      bottom:0;padding:8px var(--gut) calc(env(safe-area-inset-bottom) + 8px);
      background:linear-gradient(transparent,rgba(14,20,24,.92) 28%)}
    #mobilebar button{flex:1;min-height:46px;font-size:13px;
      background:rgba(30,42,50,.95);backdrop-filter:blur(8px)}

    /* sanal kumanda kolu */
    #stick{display:none;position:fixed;z-index:25;width:132px;height:132px;border-radius:50%;
      border:1.5px solid rgba(230,238,242,.35);background:rgba(14,20,24,.3);
      pointer-events:none;transform:translate(-50%,-50%)}
    #stick.on{display:block}
    #stickKnob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;
      border-radius:50%;background:rgba(25,198,224,.55);border:1.5px solid var(--acc)}
  }

  @media (max-width:900px) and (orientation:landscape){
    #top{max-height:74vh}
    #projects,#editor,#importer{max-height:88vh}
    #stick{width:104px;height:104px}
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.1/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.1/examples/jsm/"
}}
</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="crosshair"></div>
<div id="stick"><div id="stickKnob"></div></div>
<button id="menuBtn" aria-label="Menü">☰</button>

<div id="top" class="panel">
  <h1>Clean<span>Ai</span> · Temiz Oda 3D</h1>
  <div class="grp">
    <label>Görünüm</label>
    <button data-mode="walk">Yürü</button>
    <button data-mode="orbit">Maket</button>
  </div>
  <div class="grp">
    <label>HMI</label>
    <select id="hmiRes">
      <option value="100">100 px/m</option>
      <option value="160" selected>160 px/m</option>
      <option value="240">240 px/m</option>
    </select>
    <button id="exportBtn">İndir</button>
    <button id="publishBtn">HMI yayınla</button>
  </div>
  <div class="grp">
    <button id="importBtn" title="Teknik çizim görselinden oda üret ve proje olarak kaydet">Çizimden oda oluştur</button>
    <button id="editBtn">Ölçüleri düzenle</button>
  </div>
</div>

<div id="projects" class="panel">
  <div class="phead">
    <b>Projeler</b>
    <span id="apiState" class="dot" title="sunucu durumu"></span>
  </div>
  <div id="projList"></div>
  <div class="pactions">
    <button id="saveBtn" title="Mevcut projeyi güncelle">Kaydet</button>
    <button id="saveAsBtn" title="Yeni proje olarak kaydet">Farklı kaydet</button>
    <button id="delBtn" class="danger" title="Projeyi sil">Sil</button>
  </div>
</div>

<div id="editor" class="panel">
  <div class="phead">
    <b>Ölçüler — <span id="editName">—</span></b>
    <button id="editClose">Kapat</button>
  </div>
  <p class="small">Birim metre. <code>zones[].polygon</code> oda sınırı,
     <code>walls[].openings[].center</code> duvarın <code>a</code> ucundan uzaklık.</p>
  <textarea id="planJson" spellcheck="false"></textarea>
  <div id="editErr" class="err"></div>
  <div class="pactions">
    <button id="applyBtn">Doğrula ve uygula</button>
    <button id="revertBtn">Geri al</button>
  </div>
</div>

<div id="importer" class="panel">
  <div class="phead"><b>Teknik çizimden oda oluştur</b><button id="impClose">Kapat</button></div>
  <div id="impDrop">
    <label>Çizimi buraya sürükle ya da</label>
    <input id="impInput" type="file" accept="image/*">
    <button id="impSample" type="button">Örnek çizim</button>
    <span id="impFile" class="dim"></span>
  </div>
  <canvas id="impCanvas" width="560" height="10"></canvas>
  <div id="impSummary" class="dim">Bir çizim yükle.</div>
  <div id="impList"></div>
  <div class="fld"><label>Eşik <span id="impThresholdVal"></span></label>
    <input id="impThreshold" type="range" min="80" max="240" step="5">
    <label>En kısa çizgi <span id="impMinLineVal"></span>‰</label>
    <input id="impMinLine" type="range" min="15" max="120" step="1"></div>
  <div class="fld"><label>Dış genişlik (m)</label><input id="impWidth" type="number" min="1" step="0.1" value="8">
    <label>Tavan (m)</label><input id="impHeight" type="number" min="2" step="0.1" value="2.7">
    <label>Proje adı</label><input id="impName" type="text" placeholder="Temiz oda"></div>
  <div class="pactions"><button id="impCreate" class="on">Oda oluştur ve proje olarak kaydet</button></div>
</div>

<div id="info" class="panel">
  <div id="planName">—</div>
  <div id="legend"></div>
</div>

<div id="hint" class="panel">—</div>
<div id="toast"></div>

<div id="mobilebar">
  <button id="mModeBtn">Maket</button>
  <button id="mProjBtn">Projeler</button>
  <button id="mDoorBtn">Kapı</button>
  <button id="mInfoBtn">Bilgi</button>
</div>

<script type="module" src="./src/app.js"></script>
</body>
</html>
